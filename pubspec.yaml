name: stay_ease_hotel_reservation_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter build by
# specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as product and file version name while build-number is used as product and file version number.
# Read more about Windows versioning at https://docs.microsoft.com/en-us/windows/win32/msi/product-version
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^4.17.5
  firebase_core: ^2.32.0
  firebase_auth: ^4.17.8
  cupertino_icons: ^1.0.2
  # For price formatting
  intl: ^0.18.1
  flutter_multi_formatter: ^2.12.0
  image_picker: ^1.0.7
  firebase_storage: ^11.7.7
  google_fonts: ^6.1.0
  google_maps_flutter: ^2.5.0
  http: ^1.1.0
  provider: ^6.0.5 # New dependency for state management

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash.png
    - assets/images/logo.png
    - assets/images/welcome.png
    - assets/images/login.png
    - assets/images/register.png
    - assets/images/forgot.png
    - assets/images/otp.png
    - assets/images/profile.png
    - assets/images/hotel.png
    - assets/images/room.png
    - assets/images/room1.png
    - assets/images/room2.png
    - assets/images/room3.png
    - assets/images/room4.png
